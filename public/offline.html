<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline — Finloraq</title>
<style>
  html,body{height:100%;margin:0}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:#0B0F1A;color:#fff;text-align:center;padding:24px;box-sizing:border-box;
  }
  .card{max-width:360px}
  .dot{width:12px;height:12px;border-radius:50%;background:#5048E5;display:inline-block;margin-bottom:16px}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14px;color:#9aa0b4;line-height:1.6;margin:0 0 20px}
  button{
    background:#5048E5;color:#fff;border:none;border-radius:8px;padding:10px 18px;
    font-size:14px;font-weight:600;cursor:pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="dot"></span>
    <h1>You're offline</h1>
    <p>Finloraq needs a connection to load your books. Reconnect and try again — nothing has been lost.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
