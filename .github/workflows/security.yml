# Secret scanning (gitleaks) and PR dependency review from saas-platform-kit.
# CodeQL is off here because .github/workflows/codeql.yml already runs it.
name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    uses: mrahamangm-droid/saas-platform-kit/.github/workflows/reusable-security.yml@v1
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    with:
      run-codeql: false
